  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'kids-calendar-app';
    let firebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined') {
        firebaseConfig = JSON.parse(__firebase_config);
      }
    } catch (e) {
      console.warn("Failed to parse __firebase_config", e);
    }

    // Cloud Bridge for Cross-Device Real-time Synchronization
    window.CloudBridge = {
      isReady: false,
      userId: null,
      appId,
      db: null,
      auth: null,
      listeners: new Set(),
      init: async function() {
        if (!firebaseConfig) {
          this.notify();
          return false;
        }
        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);

          let user = null;
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const cred = await signInWithCustomToken(auth, __initial_auth_token);
            user = cred.user;
          } else {
            const cred = await signInAnonymously(auth);
            user = cred.user;
          }

          if (!user) return false;
          this.userId = user.uid;
          this.db = db;
          this.auth = auth;
          this.isReady = true;
          this.notify();
          return true;
        } catch (err) {
          console.error("Cloud Bridge initialization error:", err);
          this.notify();
          return false;
        }
      },
      subscribeCalendar: function(familyId, onData, onError) {
        if (!this.isReady || !this.db || !this.auth?.currentUser) {
          if (onError) onError(new Error("Cloud service not authenticated"));
          return () => {};
        }
        const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'family_calendars', familyId);
        return onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            onData(snapshot.data());
          } else {
            onData(null);
          }
        }, (err) => {
          console.error("Firestore listen error:", err);
          if (onError) onError(err);
        });
      },
      saveCalendar: async function(familyId, data) {
        if (!this.isReady || !this.db || !this.auth?.currentUser) return false;
        try {
          const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'family_calendars', familyId);
          await setDoc(docRef, {
            ...data,
            updatedAt: new Date().toISOString(),
            updatedBy: this.userId
          }, { merge: true });
          return true;
        } catch (err) {
          console.error("Cloud save failed:", err);
          return false;
        }
      },
      notify: function() {
        this.listeners.forEach(cb => cb(this));
      },
      onReady: function(cb) {
        if (this.isReady || firebaseConfig === null) cb(this);
        this.listeners.add(cb);
        return () => this.listeners.delete(cb);
      }
    };

    window.CloudBridge.init();
  </script>

    // Web Audio Synthesizer for cheerful reward feedback (Zero external audio file dependencies)
    const playCheerSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + index * 0.08);
          osc.stop(ctx.currentTime + index * 0.08 + 0.4);
        });
      } catch (e) {
        console.warn('Audio playback error', e);
      }
    };
  </script>

    function monthCells(y, m) {
      const firstDayOffset = (new Date(y, m, 1).getDay() + 6) % 7;
      const totalDays = new Date(y, m + 1, 0).getDate();
      const cells = Array(firstDayOffset).fill(null);
      for (let i = 1; i <= totalDays; i++) cells.push(i);
      while (cells.length % 7 !== 0) cells.push(null);
      return cells;
    }

    async function callGemini(payload, retries = 3, delay = 1000) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
        }
      }
    }

    function isTaskScheduled(t, d) {
      const s = t.schedule || { type: "daily", days: [] };
      const w = d.getDay(); // 0 is Sunday, 1 is Monday ...
      if (s.type === "daily") return true;
      if (s.type === "weekdays") return w >= 1 && w <= 5;
      if (s.type === "weekends") return w === 0 || w === 6;
      if (s.type === "custom") return (s.days || []).includes(w);
      return true;
    }

          emoji: rewardItem.emoji || "🎁",

        const newKid = makeChild(newChildName.trim(), selectedAvatar || "🧒");

        setActiveId(newKid.id);
        setNewChildName("");

        const remaining = children.filter(c => c.id !== id);
        setChildren(remaining);
        if (activeId === id) {

          emoji: cat.emoji,
          name: { zh: newTaskName.trim(), en: newTaskName.trim() },
          category: newTaskCategory,
          points: Math.max(1, Number(newTaskPoints) || 1),

            days: newTaskRepeat === "custom" ? newTaskDays : []

        setNewTaskName("");

        const url = new URL(window.location.href);
        url.searchParams.set("family", familyId);

        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand("copy");
          showToast(T.copied);

          showToast(`URL: ${textToCopy}`);

        document.body.removeChild(textArea);

          app: "Kids Behaviour Reward Calendar",
          version: 6,
          lang,
          exportedAt: new Date().toISOString(),
          activeId,
          children
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Kids_Reward_Data_${familyId}_${dateKey(new Date())}.json`;

        URL.revokeObjectURL(url);
        showToast(T.exported);

        const reader = new FileReader();

          try {
            const data = JSON.parse(event.target.result);
            if (!data.children || !Array.isArray(data.children) || !data.children.length) throw new Error();
            const cleaned = data.children.map(normalizeChild);
            setChildren(cleaned);
            setActiveId(data.activeId && cleaned.some(c => c.id === data.activeId) ? data.activeId : cleaned[0].id);
            showToast(T.restored);

        reader.readAsText(file);
        e.target.value = "";

                  )}

                  {/* Tab 3: AI Family Reward Ideas */}
                  {aiActiveTab === "rewards" && (
                    <div className="mt-4 space-y-4">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-slate-500">
                          推荐更具情感连接的低成本、高互动家庭奖励：
                        </span>
                        <button
                          disabled={aiLoading}
                          onClick={handleGenerateRewardsAI}
                          className="px-4 py-2 bg-rose-500 hover:bg-rose-600 disabled:opacity-50 text-white rounded-xl text-xs font-black transition flex items-center gap-1.5 shadow-sm"
                        >
                          <Icons.Sparkles size={15} />
                          <span>{aiLoading ? T.aiApplying : T.aiGenRewardsBtn}</span>
                        </button>
                      </div>

                      {aiLoading ? (
                        <div className="py-12 text-center text-rose-700">
                          <div className="inline-block animate-spin text-3xl mb-2">🎁</div>
                          <p className="font-black text-sm">{T.aiApplying}</p>
                        </div>
                      ) : (
                        <div className="space-y-2.5">
                          {aiGeneratedRewards.map((r, idx) => (
                            <div
                              key={idx}
                              className="p-3.5 bg-rose-50/70 border border-rose-100 rounded-2xl flex items-center justify-between gap-3"
                            >
                              <span className="text-3xl shrink-0">{r.emoji}</span>
                              <div className="flex-1 min-w-0">
                                <p className="text-xs sm:text-sm font-black text-slate-800 truncate">
                                  {lang === "zh" ? r.nameZh : r.nameEn}
                                </p>
                                <p className="text-xs font-bold text-amber-700">{T.needs} {r.points} ⭐</p>
                              </div>
                              <button
                                onClick={() => addAIRewardToCalendar(r)}
                                className="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-black shadow-xs transition"
                              >
                                加入兑奖池
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Footer Modal Action */}
                <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                  <button
                    onClick={() => setAiModalOpen(false)}
                    className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-black text-xs transition"
                  >
                    {T.aiClose}
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showCloudModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="w-full max-w-xl bg-white rounded-3xl shadow-2xl p-6 border border-slate-100 animate-pop max-h-[90vh] overflow-y-auto no-scrollbar">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center">
                      <Icons.Smartphone size={22} />
                    </div>
                    <div>
                      <h3 className="text-lg font-black text-slate-800">{T.cloudSync}</h3>
                      <p className="text-xs text-slate-500 font-bold">{T.cloudLive}</p>
                    </div>
                  </div>
                  <button onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-slate-700 p-1">
                    <Icons.Close size={20} />
                  </button>
                </div>

                <div className="space-y-4 mt-4">
                  {/* Family Sync ID Section */}
                  <div className="p-4 bg-sky-50/70 border border-sky-200 rounded-2xl">
                    <label className="text-xs font-black text-sky-900 block mb-1">
                      🔑 {T.familyIdLabel}
                    </label>
                    <p className="text-xs text-slate-600 mb-3 leading-relaxed">
                      {T.familyIdDesc}
                    </p>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={inputFamilyId}
                        onChange={e => setInputFamilyId(e.target.value)}
                        className="flex-1 px-3 py-2.5 bg-white border border-sky-200 rounded-xl text-xs sm:text-sm font-black text-sky-900 focus:outline-none focus:ring-2 focus:ring-sky-300"
                        placeholder="例如: chen-family-2026"
                      />
                      <button
                        onClick={() => {
                          const cleanId = inputFamilyId.trim() || "my-family-default";
                          setFamilyId(cleanId);
                          showToast(lang === "zh" ? `✅ 已切换至家庭口令：${cleanId}` : `✅ Connected to family code: ${cleanId}`);
                        }}
                        className="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-black transition whitespace-nowrap"
                      >
                        {T.switchFamily}
                      </button>
                    </div>
                  </div>

                  {/* One-Click Share Link for Mobile and iPad */}
                  <div className="p-4 bg-amber-50/70 border border-amber-200 rounded-2xl">
                    <label className="text-xs font-black text-amber-900 block mb-1">
                      📱 手机 / 平板专属访问链接
                    </label>
                    <p className="text-xs text-slate-600 mb-3">
                      复制此链接发送到微信、QQ、浏览器或生成桌面图标，打开即可同步家庭数据！
                    </p>
                    <button
                      onClick={copyMobileShareLink}
                      className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-xs transition"
                    >
                      <Icons.Copy size={16} />
                      <span>{T.copyLink}</span>
                    </button>
                  </div>

                  {/* Free Cloud Deployment Guide */}
                  <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5">
                    <h4 className="text-xs font-black text-slate-800 flex items-center gap-1.5">
                      <span>🚀</span>
                      <span>{T.cloudHelpTitle}</span>
                    </h4>
                    <div className="text-xs text-slate-600 space-y-2 leading-relaxed">
                      <p className="font-semibold text-slate-700">
                        您可以把这个单独的 HTML 文件托管在任何免费静态网站平台，即可拥有专属网址：
                      </p>
                      <ol className="list-decimal list-inside space-y-1.5 pl-1">
                        <li><b>Vercel / Netlify（最推荐）：</b> 直接将本 HTML 文件拖入 Netlify Drop 或部署在 Vercel，10秒内生成免费永久公网 HTTPS 域名。</li>
                        <li><b>GitHub Pages：</b> 创建免费仓库，上传重命名为 <code className="bg-slate-200 px-1 py-0.5 rounded text-slate-800">index.html</code>，开启 Pages 即可手机访问。</li>
                        <li><b>添加到手机桌面（PWA体验）：</b> 在手机 Safari 或 Chrome 打开网址后，点击“分享/菜单” ➔ “添加到主屏幕”，即可像原生 App 一样全屏使用。</li>
                      </ol>
                    </div>
                  </div>

                  {/* Client Identifier (Required for multi-user apps) */}
                  <div className="pt-2 flex items-center justify-between text-[11px] text-slate-400">
                    <span>{T.cloudUserId}:</span>
                    <span className="font-mono font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded">
                      {cloudUserId || "client-local-ready"}
                    </span>
                  </div>
                </div>

                <div className="mt-5 text-right">
                  <button
                    onClick={() => setShowCloudModal(false)}
                    className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-black text-xs transition"
                  >
                    {T.cancel}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
